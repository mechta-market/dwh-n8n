# Сборка n8n 2.x для копии (n8n2.zeon.mdev.kz), на которой проверяется переход с 1.x.
# Тег образа — v2: боевой n8n берёт latest (ветка master), эта сборка его не трогает.
# После переключения боевого n8n на 2.x ветку влить в master, а этот файл удалить.
name: Deploy v2
on:
  push:
    branches:
      - v2
jobs:
  build:
    name: Build
    runs-on: yc-arc
    env:
      OWNER: mechta-market
      IMAGE: dwh-n8n
    steps:
      - uses: actions/checkout@v4

      - run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u $ --password-stdin

      - run: docker build -t ghcr.io/$OWNER/$IMAGE:v2 .

      - run: docker push ghcr.io/$OWNER/$IMAGE:v2
